<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="art"></div>
    <div class="shade"></div>
    <div class="panel">
      <p class="status">Ready</p>
      <div class="time">25:00</div>
      <div class="actions">
        <button class="btn primary" type="button">Start</button>
        <button class="btn" type="button">Reset</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
